
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarefa | DebTec Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>DebTec Task Manager</h1>
        <p>Organização inteligente. Gestão eficiente.</p>
    </header>

    <main>
        <h2>Editar tarefa</h2>

        <section>
            <form action="{{ url_for('editar', id=tarefa['id']) }}" method="POST">

                <label for="titulo">Título:</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    value="{{ tarefa['titulo'] }}"
                    required
                >

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao">{{ tarefa['descricao'] }}</textarea>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" name="prioridade">
                    <option value="Baixa" {% if tarefa['prioridade'] == 'Baixa' %}selected{% endif %}>Baixa</option>
                    <option value="Média" {% if tarefa['prioridade'] == 'Média' %}selected{% endif %}>Média</option>
                    <option value="Alta" {% if tarefa['prioridade'] == 'Alta' %}selected{% endif %}>Alta</option>
                </select>

                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="Pendente" {% if tarefa['status'] == 'Pendente' %}selected{% endif %}>Pendente</option>
                    <option value="Em andamento" {% if tarefa['status'] == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                    <option value="Concluída" {% if tarefa['status'] == 'Concluída' %}selected{% endif %}>Concluída</option>
                </select>

                <button type="submit">Salvar alterações</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por DebTec Solutions</p>
    </footer>

</body>
</html>
